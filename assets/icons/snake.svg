<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="snBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="snBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
    <filter id="snGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#snBg)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 24 24 L 104 24 M 24 44 L 104 44 M 24 64 L 104 64 M 24 84 L 104 84 M 24 104 L 104 104" stroke="#065f46" stroke-width="0.8" opacity="0.4"/>
  <path d="M 24 24 L 24 104 M 44 24 L 44 104 M 64 24 L 64 104 M 84 24 L 84 104 M 104 24 L 104 104" stroke="#065f46" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Snake Body -->
  <path d="M 32 88 L 32 50 A 10 10 0 0 1 52 50 L 52 74 A 10 10 0 0 0 72 74 L 72 38" 
        fill="none" stroke="url(#snBody)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#snGlow)"/>
        
  <!-- Snake Head Eyes -->
  <circle cx="68" cy="34" r="2.5" fill="#ffffff"/>
  <circle cx="76" cy="34" r="2.5" fill="#ffffff"/>
  <circle cx="68" cy="33" r="1.2" fill="#052e16"/>
  <circle cx="76" cy="33" r="1.2" fill="#052e16"/>
  
  <!-- Glowing Red Apple -->
  <circle cx="92" cy="40" r="8" fill="url(#appleGrad)" filter="url(#snGlow)"/>
  <path d="M 92 32 C 94 28, 97 29, 98 27" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
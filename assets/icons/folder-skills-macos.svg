<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <!-- Back folder gradients -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a85e8"/>
      <stop offset="100%" stop-color="#145cb5"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3894f8"/>
      <stop offset="100%" stop-color="#1d6fd6"/>
    </linearGradient>
    
    <!-- Front folder gradient - authentic macOS Aqua -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64cdfc"/>
      <stop offset="8%" stop-color="#36acf8"/>
      <stop offset="45%" stop-color="#1c8ff4"/>
      <stop offset="100%" stop-color="#0b6bd3"/>
    </linearGradient>

    <!-- Top lip highlight -->
    <linearGradient id="lipHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>

    <!-- Drop shadow for front flap -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00183b" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00183b" flood-opacity="0.2"/>
    </filter>

    <filter id="emblemEtch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#06428c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Back Flap with Tab -->
  <path d="M12,22 C12,17.5 15.5,14 20,14 L46,14 C50,14 53,16.5 56,20 L61,26 L100,26 C104.5,26 108,29.5 108,34 L108,58 C108,62.5 104.5,66 100,66 L20,66 C15.5,66 12,62.5 12,58 Z" fill="url(#backGrad)"/>
  
  <!-- Back Tab Highlight Edge -->
  <path d="M20,14.5 L46,14.5 C49.8,14.5 52.8,16.8 55.7,20.4 L60.7,26.5 L100,26.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>

  <!-- Interior Back Layer Shadow -->
  <path d="M12,26 L108,26 L108,34 L12,34 Z" fill="rgba(0,30,80,0.18)"/>

  <!-- Front Folder Body with Drop Shadow -->
  <g filter="url(#folderShadow)">
    <path d="M10,32 C10,27.5 13.5,24 18,24 L102,24 C106.5,24 110,27.5 110,32 L110,82 C110,87.5 105.5,92 100,92 L20,92 C14.5,92 10,87.5 10,82 Z" fill="url(#frontGrad)"/>
    <!-- Top specular edge border -->
    <path d="M18,24.6 L102,24.6" stroke="url(#lipHighlight)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Border stroke -->
    <path d="M10,32 C10,27.5 13.5,24 18,24 L102,24 C106.5,24 110,27.5 110,32 L110,82 C110,87.5 105.5,92 100,92 L20,92 C14.5,92 10,87.5 10,82 Z" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
  </g>

  <!-- Front Embossed Emblem -->
  <g filter="url(#emblemEtch)" opacity="0.85">
    <!-- Terminal CLI Prompt -->
    <rect x="43" y="46" width="34" height="24" rx="3" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M48,53 L53,57 L48,61" fill="none" stroke="#1c8ff4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="56" y1="62" x2="64" y2="62" stroke="#1c8ff4" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="boBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="boGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#boBg)"/>
  
  <!-- Colorful Bricks -->
  <!-- Row 1: Red -->
  <rect x="20" y="26" width="18" height="9" rx="2" fill="#ef4444"/>
  <rect x="42" y="26" width="18" height="9" rx="2" fill="#ef4444"/>
  <rect x="64" y="26" width="18" height="9" rx="2" fill="#ef4444"/>
  <rect x="86" y="26" width="18" height="9" rx="2" fill="#ef4444"/>
  
  <!-- Row 2: Orange -->
  <rect x="20" y="38" width="18" height="9" rx="2" fill="#f97316"/>
  <rect x="42" y="38" width="18" height="9" rx="2" fill="#f97316"/>
  <rect x="86" y="38" width="18" height="9" rx="2" fill="#f97316"/>
  
  <!-- Row 3: Green -->
  <rect x="20" y="50" width="18" height="9" rx="2" fill="#10b981"/>
  <rect x="64" y="50" width="18" height="9" rx="2" fill="#10b981"/>
  <rect x="86" y="50" width="18" height="9" rx="2" fill="#10b981"/>
  
  <!-- Row 4: Blue -->
  <rect x="42" y="62" width="18" height="9" rx="2" fill="#3b82f6"/>
  <rect x="64" y="62" width="18" height="9" rx="2" fill="#3b82f6"/>
  
  <!-- Bouncing Ball with Trail -->
  <circle cx="56" cy="74" r="3" fill="#f59e0b" opacity="0.3"/>
  <circle cx="60" cy="80" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="64" cy="86" r="6" fill="url(#ballGrad)" filter="url(#boGlow)"/>
  
  <!-- Paddle -->
  <rect x="44" y="102" width="40" height="8" rx="4" fill="url(#padGrad)" filter="url(#boGlow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#1b1b1f"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2ff"/>
      <stop offset="1" stop-color="#9fc2f2"/>
    </linearGradient>
    <linearGradient id="win2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f7e6"/>
      <stop offset="1" stop-color="#86d3a7"/>
    </linearGradient>
    <linearGradient id="win3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeedd"/>
      <stop offset="1" stop-color="#f3b98a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <!-- spaces bar -->
  <rect x="150" y="74" width="62" height="38" rx="8" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="225" y="74" width="62" height="38" rx="8" fill="#ffffff" fill-opacity="0.42"/>
  <rect x="300" y="74" width="62" height="38" rx="8" fill="#ffffff" fill-opacity="0.18"/>
  <!-- windows -->
  <g filter="url(#s)">
    <rect x="72" y="150" width="168" height="124" rx="14" fill="url(#win2)"/>
    <rect x="272" y="150" width="168" height="124" rx="14" fill="url(#win3)"/>
    <rect x="132" y="250" width="248" height="182" rx="18" fill="url(#win)"/>
  </g>
  <g fill-opacity="0.9">
    <circle cx="90" cy="168" r="6" fill="#ff5f57"/><circle cx="108" cy="168" r="6" fill="#febc2e"/><circle cx="126" cy="168" r="6" fill="#28c840"/>
    <circle cx="290" cy="168" r="6" fill="#ff5f57"/><circle cx="308" cy="168" r="6" fill="#febc2e"/><circle cx="326" cy="168" r="6" fill="#28c840"/>
    <circle cx="156" cy="274" r="8" fill="#ff5f57"/><circle cx="180" cy="274" r="8" fill="#febc2e"/><circle cx="204" cy="274" r="8" fill="#28c840"/>
  </g>
  <rect x="156" y="300" width="200" height="12" rx="6" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="156" y="324" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
</svg>

name: Continuous Integration & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code Quality & Component Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 - JavaScript Syntax Validation
        run: npm run test:syntax

      - name: Gate 2 - Static Asset Integrity & Link Verification
        run: npm run test:assets

      - name: Gate 3 - Behavioural Component Suite (jsdom)
        run: npm run test:components

      - name: Gate 5 - Template Integrity (nothing personal outside the info bank)
        run: npm run test:template

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Gate 4 - Real-Browser End-to-End Suite (Playwright)
        run: npm run test:e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
